services:
  - type: web
    name: nyaya-darshan
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python scripts/release_preflight.py --repository-only"
    # Use uvicorn directly — never python run.py in production (run.py enables reload=True
    # only when RELOAD_ON_CHANGE=1, but uvicorn direct is cleaner for platform deployments).
    startCommand: "python scripts/release_preflight.py --environment-only && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers ${WEB_CONCURRENCY:-1} --proxy-headers --forwarded-allow-ips=127.0.0.1"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LLM_PROVIDER
        value: nvidia
      - key: NVIDIA_LLM_MODEL
        value: nvidia/llama-3.3-nemotron-super-49b-v1
      - key: NVIDIA_API_KEY
        sync: false
      - key: NYAYA_API_KEY
        generateValue: true
      - key: NYAYA_JWT_SECRET
        generateValue: true
      - key: NYAYA_DATA_DIR
        value: /var/data
      - key: RAW_DIR
        value: /var/data/uploads
      - key: NYAYA_LOG_DIR
        value: /var/data/logs
      - key: NYAYA_LOG_QUERY_TEXT
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
    disk:
      name: nyaya-darshan-data
      mountPath: /var/data
      sizeGB: 5
