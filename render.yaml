services:
  - type: web
    name: nyaya-darshan
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LLM_PROVIDER
        value: nvidia
      - key: NVIDIA_LLM_MODEL
        value: nvidia/llama-3.3-nemotron-super-49b-v1
      - key: NVIDIA_API_KEY
        sync: false
      - key: LEGAL_REQUEST_TIMEOUT
        value: "75"
      - key: LEGAL_MODEL_TIMEOUT
        value: "60"
      - key: LEGAL_MAX_TOKENS
        value: "320"
      - key: LEGAL_CACHE_TTL_SECONDS
        value: "300"
      - key: LEGAL_MAX_CONCURRENCY
        value: "4"
      - key: LEGAL_MAX_RETRIES
        value: "2"
      - key: NYAYA_API_KEY
        generateValue: true
      - key: NYAYA_JWT_SECRET
        generateValue: true
      - key: NYAYA_DATA_DIR
        value: /var/data
      - key: RAW_DIR
        value: /var/data/uploads
      - key: NYAYA_LOG_DIR
        value: /var/data/logs
      - key: NYAYA_LOG_QUERY_TEXT
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false
    disk:
      name: nyaya-darshan-data
      mountPath: /var/data
      sizeGB: 5
