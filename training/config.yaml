# Phase 6 — SFT / QLoRA Configuration for Nyaya Darshana
# Project: Nyaya Legal OS

model:
  base_model_name: "meta-llama/Meta-Llama-3.1-8B-Instruct"
  fallback_small_model: "meta-llama/Llama-3.2-3B-Instruct"
  torch_dtype: "float16"
  trust_remote_code: true
  device_map: "auto"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "float16"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "d:/Nova Legal/training/adapters/nyaya_legal_adapter"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0001  # Conservative LR (1e-4) to prevent catastrophic forgetting
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  eval_steps: 50
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  max_seq_length: 1024
  optimizer: "paged_adamw_8bit"
  fp16: true
  random_seed: 42

dataset:
  train_file: "d:/Nova Legal/training/train.jsonl"
  validation_file: "d:/Nova Legal/training/validation.jsonl"
  test_file: "d:/Nova Legal/training/test.jsonl"
  manifest_file: "d:/Nova Legal/training/dataset_manifest.json"
  benchmark_file: "d:/Nova Legal/evaluation/benchmark_800.jsonl"
  split_ratios:
    train: 0.80
    validation: 0.10
    test: 0.10

hardware_requirements:
  local_detected_vram_gb: 4.0
  local_detected_ram_gb: 8.0
  required_7b_8b_qlora_vram_gb: 16.0
  recommended_environment: "Google Colab T4/A100 GPU or RunPod A10G"
  local_dry_run_enabled: true
