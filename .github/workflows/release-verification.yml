name: Release verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: development
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate deployment inputs
        run: python scripts/release_preflight.py --repository-only
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
          pip check
      - name: Compile Python source
        run: python -m compileall -q app api database retrieval scripts tests
      - name: Run security and application release gates
        run: pytest -q tests app/test_app_endpoints.py --ignore=tests/test_playwright_e2e_product.py
